<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#00b4d8">
<title>Ghoz World — Roblox Style</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#00b4d8;font-family:'Fredoka One','Segoe UI',Arial,sans-serif}
canvas{display:block;position:fixed;inset:0;z-index:1}

/* START SCREEN ROBLOX */
#startScreen{
  position:fixed;inset:0;z-index:200;
  background:linear-gradient(180deg,#0a1628 0%,#1a2a4a 40%,#2d4a7a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center;
}
#startScreen .logo{
  font-size:56px;font-weight:900;
  color:#fff;text-shadow:0 8px 0 #0a1628,0 12px 40px rgba(0,0,0,.5);
  letter-spacing:3px;margin-bottom:2px;
}
#startScreen .logo span{color:#ffd60a}
#startScreen .sub{
  font-size:16px;color:rgba(255,255,255,.7);
  background:rgba(255,255,255,.05);padding:6px 24px;border-radius:30px;
  margin-bottom:28px;border:1px solid rgba(255,255,255,.08);
}
.form-group{width:100%;max-width:340px;margin-bottom:14px;text-align:left}
.form-group label{
  display:block;font-size:13px;font-weight:700;color:rgba(255,255,255,.7);
  margin-bottom:5px;letter-spacing:1px;
}
.form-group input{
  width:100%;padding:14px 18px;border-radius:12px;
  border:2px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);
  color:#fff;font-size:18px;font-weight:700;outline:none;
  transition:all .2s;
}
.form-group input:focus{border-color:#ffd60a;background:rgba(255,255,255,.1)}
.form-group input::placeholder{color:rgba(255,255,255,.3)}
.gender-row{display:flex;gap:12px;justify-content:center;margin:4px 0 20px}
.gender-btn{
  flex:1;max-width:140px;padding:14px 8px;border-radius:16px;
  border:3px solid transparent;background:rgba(255,255,255,.06);
  color:#fff;font-weight:700;font-size:14px;cursor:pointer;
  transition:all .2s;backdrop-filter:blur(4px);
}
.gender-btn .emoji{font-size:36px;display:block;margin-bottom:2px}
.gender-btn .label{font-size:11px;opacity:.6;letter-spacing:1px}
.gender-btn.boy{border-color:rgba(72,202,228,.3)}
.gender-btn.girl{border-color:rgba(255,133,161,.3)}
.gender-btn.selected.boy{background:rgba(72,202,228,.2);border-color:#48cae4;transform:scale(1.03)}
.gender-btn.selected.girl{background:rgba(255,133,161,.2);border-color:#ff85a1;transform:scale(1.03)}
.gender-btn.selected .label{opacity:1}
#startBtn{
  width:100%;max-width:340px;padding:16px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#ffd60a,#f77f00);
  color:#0a1628;font-size:20px;font-weight:900;
  cursor:pointer;box-shadow:0 6px 0 #b85e00,0 10px 40px rgba(247,127,0,.3);
  transition:all .08s ease;letter-spacing:1px;
}
#startBtn:active{transform:translateY(6px);box-shadow:0 1px 0 #b85e00}

/* HUD */
#hud,#players,#locationBadge{
  position:fixed;z-index:20;color:#fff;font-weight:700;
  background:rgba(10,22,40,.7);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:8px 16px;backdrop-filter:blur(16px);
  box-shadow:0 4px 24px rgba(0,0,0,.3);
}
#hud{top:12px;left:12px;min-width:130px}
#playerName{font-size:15px;font-weight:900;color:#ffd60a}
#status{font-size:10px;opacity:.6;margin-top:2px}
#players{top:12px;right:12px;font-size:13px}
#players span{color:#ffd60a;font-size:17px}
#locationBadge{
  top:12px;left:50%;transform:translateX(-50%);
  font-size:12px;padding:5px 20px;border-radius:30px;
  background:rgba(10,22,40,.7);display:none;border-color:rgba(255,215,0,.2);
}

/* JOYSTICK */
#joystick{
  position:fixed;left:20px;bottom:24px;
  width:130px;height:130px;z-index:30;border-radius:50%;
  background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.08);
  box-shadow:inset 0 0 60px rgba(0,0,0,.2),0 8px 32px rgba(0,0,0,.3);
  backdrop-filter:blur(8px);
}
#stick{
  position:absolute;width:58px;height:58px;left:50%;top:50%;margin:-29px;
  border-radius:50%;background:radial-gradient(circle,#fff,#e0e0e0);
  border:3px solid #ffd60a;box-shadow:0 4px 20px rgba(255,214,10,.3);
  pointer-events:none;
}
#joystickLabel{
  position:fixed;left:24px;bottom:4px;z-index:29;
  color:rgba(255,255,255,.2);font-size:8px;font-weight:700;
  pointer-events:none;letter-spacing:2px;
}

/* BUTTONS 3D ROBLOX */
#jumpBtn,#interactBtn,#chatToggle{
  position:fixed;z-index:30;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;touch-action:none;
  border:2px solid rgba(255,255,255,.1);
  font-size:24px;transition:all .06s ease;
  box-shadow:0 4px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.2);
}
#jumpBtn{
  right:20px;bottom:100px;width:68px;height:68px;
  background:linear-gradient(145deg,#ff6b6b,#d62828);
  box-shadow:0 4px 0 #8e1a1a,0 8px 24px rgba(214,40,40,.3);
  font-size:28px;
}
#interactBtn{
  right:20px;bottom:24px;width:64px;height:64px;
  background:linear-gradient(145deg,#00c853,#008000);
  box-shadow:0 4px 0 #004d00,0 8px 24px rgba(0,200,83,.3);
  display:none;font-size:28px;
}
#chatToggle{
  right:20px;bottom:176px;width:56px;height:56px;
  background:linear-gradient(145deg,#7c4dff,#4a00e0);
  box-shadow:0 4px 0 #2d0075,0 8px 24px rgba(124,77,255,.3);
  font-size:20px;
}
#jumpBtn:active,#interactBtn:active,#chatToggle:active{
  transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3);
}

/* CHAT */
#chatBar{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  z-index:40;width:min(340px,90vw);display:none;gap:10px;align-items:center;
}
#chatInput{
  flex:1;padding:12px 18px;border-radius:30px;border:2px solid #ffd60a;
  background:rgba(10,22,40,.9);color:#fff;font-size:15px;outline:none;font-weight:600;
}
#chatInput::placeholder{color:rgba(255,255,255,.3)}
#chatSend{
  width:48px;height:48px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#ffd60a,#f77f00);
  color:#0a1628;font-size:20px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 0 #b85e00;
}
#chatSend:active{transform:translateY(3px);box-shadow:0 1px 0 #b85e00}

/* PASSWORD MODAL */
#passModal{
  position:fixed;inset:0;z-index:150;
  background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;
  padding:20px;backdrop-filter:blur(8px);
}
#passModal .box{
  background:linear-gradient(180deg,#0a1628,#1a2a4a);
  border-radius:20px;padding:32px 28px;width:100%;max-width:340px;
  text-align:center;color:#fff;border:2px solid #ffd60a;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
#passModal h3{font-size:22px;color:#ffd60a;margin-bottom:4px}
#passModal p{font-size:13px;opacity:.5;margin-bottom:16px}
#passInput{
  width:100%;padding:14px;border-radius:12px;border:2px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);color:#fff;font-size:20px;text-align:center;
  letter-spacing:6px;outline:none;margin-bottom:16px;font-weight:700;
}
#passInput:focus{border-color:#ffd60a}
#passSubmit,#passCancel{padding:12px 28px;border-radius:12px;border:none;font-weight:800;font-size:14px;cursor:pointer;margin:0 6px}
#passSubmit{background:linear-gradient(135deg,#ffd60a,#f77f00);color:#0a1628;box-shadow:0 4px 0 #b85e00}
#passCancel{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.1)}
#passSubmit:active{transform:translateY(3px);box-shadow:0 1px 0 #b85e00}

#prompt{
  position:fixed;bottom:155px;left:50%;transform:translateX(-50%);
  z-index:25;background:rgba(10,22,40,.8);color:#ffd60a;
  padding:8px 20px;border-radius:30px;font-size:12px;font-weight:700;
  display:none;border:1px solid rgba(255,214,10,.2);
  pointer-events:none;backdrop-filter:blur(8px);
}

/* LOADING ROBLOX */
#loading{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:linear-gradient(180deg,#0a1628,#1a2a4a);
  color:#fff;transition:opacity .5s;
}
#loading .logo{font-size:60px;font-weight:900;color:#fff;text-shadow:0 8px 0 #0a1628}
#loading .logo span{color:#ffd60a}
#loadingSub{font-size:16px;opacity:.4;margin-top:4px;letter-spacing:4px}
.loader-wrap{margin-top:30px;display:flex;gap:12px}
.loader-dot{
  width:16px;height:16px;background:#ffd60a;border-radius:50%;
  animation:bounce 1s infinite alternate;
}
.loader-dot:nth-child(2){animation-delay:.2s}
.loader-dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%{transform:translateY(0);opacity:.2}100%{transform:translateY(-24px);opacity:1}}
.fade-out{opacity:0;pointer-events:none}
.hidden{display:none!important}

/* TRANSITION SCREEN SAAT PINDAH RUANGAN */
#transitionOverlay{
  position:fixed;inset:0;z-index:50;
  background:#0a1628;display:none;
  align-items:center;justify-content:center;flex-direction:column;
  color:#fff;transition:opacity .6s;
}
#transitionOverlay .txt{font-size:20px;font-weight:700;color:#ffd60a;letter-spacing:2px}
#transitionOverlay .sub{font-size:13px;opacity:.4;margin-top:6px}

@media(max-width:400px){
  #startScreen .logo{font-size:40px}
  #joystick{width:100px;height:100px}
  #stick{width:44px;height:44px;margin:-22px}
  #jumpBtn{width:56px;height:56px;font-size:22px}
  #interactBtn{width:52px;height:52px;font-size:22px}
  #chatToggle{width:46px;height:46px;font-size:18px}
}
</style>
</head>
<body>

<div id="startScreen">
  <div class="logo">GHOZ <span>WORLD</span></div>
  <div class="sub">✦ ROBLOX 3D HANGOUT ✦</div>
  <div class="form-group">
    <label>👤 NAMA KAMU</label>
    <input type="text" id="nickInput" placeholder="Masukkan nama..." maxlength="16" autocomplete="off">
  </div>
  <div class="form-group">
    <label>🎨 KARAKTER</label>
    <div class="gender-row">
      <button class="gender-btn boy" data-gender="boy">
        <span class="emoji">👦</span>
        <span class="label">COWOK</span>
      </button>
      <button class="gender-btn girl" data-gender="girl">
        <span class="emoji">👧</span>
        <span class="label">CEWEK</span>
      </button>
    </div>
  </div>
  <button id="startBtn">🚀 MASUK DUNIA</button>
</div>

<div id="loading" class="hidden">
  <div class="logo">GHOZ <span>WORLD</span></div>
  <div id="loadingSub">✦ LOADING DUNIA ✦</div>
  <div class="loader-wrap">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>
</div>

<!-- TRANSITION OVERLAY SAAT PINDAH RUANGAN -->
<div id="transitionOverlay">
  <div class="txt">✦ MEMASUKI ✦</div>
  <div class="sub" id="transitionText">Rumah Hangout</div>
</div>

<div id="hud" class="hidden"><div id="playerName">Player</div><div id="status">⏳ Menghubungkan...</div></div>
<div id="players" class="hidden">👥 <span id="playerCount">1</span> Pemain</div>
<div id="locationBadge">📍 Outdoor</div>

<div id="joystick" class="hidden"><div id="stick"></div></div>
<div id="joystickLabel" class="hidden">◀ GERAK ▶</div>
<div id="jumpBtn" class="hidden">⬆</div>
<div id="interactBtn" class="hidden">🚪</div>
<div id="chatToggle" class="hidden">💬</div>

<div id="chatBar">
  <input type="text" id="chatInput" placeholder="Ketik pesan..." maxlength="60" autocomplete="off">
  <button id="chatSend">➤</button>
</div>

<div id="prompt">🔑 Tekan 🚪 untuk masuk</div>

<div id="passModal">
  <div class="box">
    <h3>🔐 MUSEUM RAHASIA</h3>
    <p>Masukkan password spesial</p>
    <input type="password" id="passInput" placeholder="••••••" maxlength="20">
    <div>
      <button id="passCancel">Batal</button>
      <button id="passSubmit">Masuk</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
