<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <meta name="theme-color" content="#111118" />
  <title>Dunia 3D Multiplayer</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111118;
      touch-action: none;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      color: white;
      background: rgba(0,0,0,.45);
      padding: 10px 12px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      font-size: 13px;
      pointer-events: none;
    }

    #status { margin-top: 4px; opacity: .8; }

    #dpad {
      position: fixed;
      left: 22px;
      bottom: 22px;
      z-index: 30;
      display: grid;
      grid-template-columns: 64px 64px 64px;
      grid-template-rows: 64px 64px 64px;
      gap: 6px;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn {
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 16px;
      background: rgba(255,255,255,.20);
      color: white;
      font-size: 25px;
      backdrop-filter: blur(8px);
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    .btn:active, .btn.active {
      background: rgba(255,255,255,.42);
      transform: scale(.96);
    }

    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }

    #hint {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 20;
      color: rgba(255,255,255,.75);
      font-size: 11px;
      background: rgba(0,0,0,.3);
      padding: 8px 10px;
      border-radius: 10px;
    }

    @media (min-width: 800px) {
      #dpad { left: 30px; bottom: 30px; }
      .btn { width: 58px; height: 58px; }
      #dpad {
        grid-template-columns: 58px 58px 58px;
        grid-template-rows: 58px 58px 58px;
      }
    }
  </style>
</head>

<body>
  <div id="hud">
    <div id="playerName">Menghubungkan...</div>
    <div id="status">Connecting...</div>
  </div>

  <div id="dpad">
    <button class="btn" id="up" aria-label="Maju">⬆️</button>
    <button class="btn" id="left" aria-label="Kiri">⬅️</button>
    <button class="btn" id="down" aria-label="Mundur">⬇️</button>
    <button class="btn" id="right" aria-label="Kanan">➡️</button>
  </div>

  <div id="hint">Tahan tombol untuk berjalan</div>

  <script src="app.js"></script>
</body>
</html>
