<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#00b4d8">
<title>Ghoz World — Roblox Style</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#00b4d8;font-family:'Fredoka One','Segoe UI',Arial,sans-serif}
canvas{display:block;position:fixed;inset:0;z-index:1}

/* ===== ROBLOX-STYLE START SCREEN ===== */
#startScreen{
  position:fixed;inset:0;z-index:200;
  background:linear-gradient(180deg,#0077b6 0%,#00b4d8 40%,#90e0ef 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center;
}
#startScreen .logo{
  font-size:52px;font-weight:900;
  color:#fff;text-shadow:0 6px 0 #0077b6,0 10px 30px rgba(0,0,0,.3);
  letter-spacing:2px;margin-bottom:2px;
}
#startScreen .logo span{color:#ffd60a}
#startScreen .sub{
  font-size:18px;color:#fff;opacity:.9;
  background:rgba(0,0,0,.2);padding:6px 20px;border-radius:30px;
  margin-bottom:30px;font-weight:400;
}

.form-group{
  width:100%;max-width:320px;margin-bottom:14px;text-align:left;
}
.form-group label{
  display:block;font-size:14px;font-weight:700;color:#fff;
  margin-bottom:5px;text-shadow:0 2px 4px rgba(0,0,0,.2);
}
.form-group input{
  width:100%;padding:14px 18px;border-radius:16px;
  border:3px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.2);
  color:#fff;font-size:18px;font-weight:700;outline:none;
  backdrop-filter:blur(4px);
  transition:all .2s;
}
.form-group input:focus{border-color:#ffd60a;background:rgba(255,255,255,.3)}
.form-group input::placeholder{color:rgba(255,255,255,.6)}

.gender-row{
  display:flex;gap:14px;justify-content:center;margin:4px 0 18px;
}
.gender-btn{
  flex:1;max-width:140px;padding:16px 8px;border-radius:20px;
  border:4px solid transparent;background:rgba(255,255,255,.15);
  color:#fff;font-weight:800;font-size:16px;cursor:pointer;
  transition:all .2s;backdrop-filter:blur(4px);
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
.gender-btn .emoji{font-size:34px;display:block;margin-bottom:2px}
.gender-btn .label{font-size:13px;opacity:.8}
.gender-btn.boy{border-color:#48cae4}
.gender-btn.girl{border-color:#ff85a1}
.gender-btn.selected.boy{
  background:#48cae4;color:#023e8a;transform:scale(1.05);
  box-shadow:0 6px 30px rgba(72,202,228,.5);
}
.gender-btn.selected.girl{
  background:#ff85a1;color:#590d22;transform:scale(1.05);
  box-shadow:0 6px 30px rgba(255,133,161,.5);
}
.gender-btn.selected .label{opacity:1}

#startBtn{
  width:100%;max-width:320px;padding:16px;border:none;border-radius:18px;
  background:linear-gradient(135deg,#ffd60a,#f77f00);
  color:#003566;font-size:20px;font-weight:900;
  cursor:pointer;box-shadow:0 8px 0 #d62828,0 10px 30px rgba(214,40,40,.3);
  transition:all .08s ease;
  letter-spacing:1px;
}
#startBtn:active{transform:translateY(6px);box-shadow:0 2px 0 #d62828}

/* ===== HUD ROBLOX STYLE ===== */
#hud,#players,#locationBadge{
  position:fixed;z-index:20;
  color:#fff;font-weight:700;
  background:rgba(0,0,0,.55);
  border:3px solid rgba(255,255,255,.15);
  border-radius:16px;padding:8px 16px;
  backdrop-filter:blur(12px);
  box-shadow:0 4px 24px rgba(0,0,0,.3);
}
#hud{top:max(12px,env(safe-area-inset-top));left:12px;min-width:140px}
#playerName{font-size:16px;font-weight:900;color:#ffd60a}
#status{font-size:11px;opacity:.8;margin-top:2px}
#players{top:max(12px,env(safe-area-inset-top));right:12px;font-size:14px}
#players span{color:#ffd60a;font-size:18px}
#locationBadge{
  top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  font-size:13px;padding:5px 20px;border-radius:30px;
  background:rgba(0,0,0,.6);
  display:none;border-color:rgba(255,215,0,.3);
}

/* ===== JOYSTICK ROBLOX ===== */
#joystick{
  position:fixed;left:20px;bottom:max(24px,env(safe-area-inset-bottom));
  width:130px;height:130px;z-index:30;border-radius:50%;
  background:rgba(0,0,0,.25);
  border:4px solid rgba(255,255,255,.25);
  box-shadow:inset 0 0 40px rgba(0,0,0,.2),0 8px 32px rgba(0,0,0,.3);
  backdrop-filter:blur(8px);
}
#stick{
  position:absolute;width:58px;height:58px;left:50%;top:50%;margin:-29px;
  border-radius:50%;background:radial-gradient(circle,#fff,#e0e0e0);
  border:4px solid #ffd60a;
  box-shadow:0 4px 20px rgba(255,214,10,.4);
  pointer-events:none;
}
#joystickLabel{
  position:fixed;left:24px;bottom:max(4px,env(safe-area-inset-bottom));
  z-index:29;color:rgba(255,255,255,.5);font-size:9px;font-weight:700;
  pointer-events:none;letter-spacing:1px;
}

/* ===== BUTTONS ROBLOX ===== */
#jumpBtn,#interactBtn,#chatToggle{
  position:fixed;z-index:30;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;touch-action:none;
  border:4px solid rgba(255,255,255,.3);
  font-size:24px;
  transition:all .08s ease;
  box-shadow:0 6px 0 rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.25);
}
#jumpBtn{
  right:20px;bottom:max(100px,calc(env(safe-area-inset-bottom)+80px));
  width:68px;height:68px;
  background:linear-gradient(145deg,#ff6b6b,#d62828);
  box-shadow:0 6px 0 #a4161a,0 8px 24px rgba(214,40,40,.4);
  font-size:28px;
}
#interactBtn{
  right:20px;bottom:max(24px,env(safe-area-inset-bottom));
  width:64px;height:64px;
  background:linear-gradient(145deg,#00c853,#008000);
  box-shadow:0 6px 0 #006400,0 8px 24px rgba(0,200,83,.4);
  display:none;font-size:28px;
}
#chatToggle{
  right:20px;bottom:max(176px,calc(env(safe-area-inset-bottom)+156px));
  width:56px;height:56px;
  background:linear-gradient(145deg,#7c4dff,#4a00e0);
  box-shadow:0 6px 0 #2d0075,0 8px 24px rgba(124,77,255,.4);
  font-size:22px;
}
#jumpBtn:active,#interactBtn:active,#chatToggle:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 rgba(0,0,0,.2);
}

/* ===== CHAT ===== */
#chatBar{
  position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:40;width:min(340px,90vw);
  display:none;gap:10px;align-items:center;
}
#chatInput{
  flex:1;padding:12px 18px;border-radius:30px;
  border:3px solid #ffd60a;
  background:rgba(0,0,0,.8);color:#fff;font-size:15px;
  outline:none;font-weight:600;backdrop-filter:blur(8px);
}
#chatInput::placeholder{color:rgba(255,255,255,.4)}
#chatSend{
  width:48px;height:48px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#ffd60a,#f77f00);
  color:#003566;font-size:20px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 0 #d62828;
}
#chatSend:active{transform:translateY(3px);box-shadow:0 1px 0 #d62828}

/* ===== PASSWORD ===== */
#passModal{
  position:fixed;inset:0;z-index:150;
  background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(6px);
}
#passModal .box{
  background:linear-gradient(180deg,#1a1a2e,#16213e);
  border-radius:24px;padding:32px 28px;
  width:100%;max-width:340px;text-align:center;color:#fff;
  border:3px solid #ffd60a;box-shadow:0 20px 60px rgba(0,0,0,.6);
}
#passModal h3{font-size:24px;color:#ffd60a;margin-bottom:4px}
#passModal p{font-size:14px;opacity:.7;margin-bottom:16px}
#passInput{
  width:100%;padding:14px;border-radius:14px;
  border:3px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:#fff;font-size:20px;
  text-align:center;letter-spacing:6px;outline:none;
  margin-bottom:16px;font-weight:700;
}
#passInput:focus{border-color:#ffd60a}
#passSubmit,#passCancel{
  padding:12px 28px;border-radius:14px;border:none;
  font-weight:800;font-size:15px;cursor:pointer;margin:0 6px;
}
#passSubmit{
  background:linear-gradient(135deg,#ffd60a,#f77f00);
  color:#003566;box-shadow:0 4px 0 #d62828;
}
#passCancel{background:rgba(255,255,255,.12);color:#fff}

#prompt{
  position:fixed;bottom:max(160px,calc(env(safe-area-inset-bottom)+140px));left:50%;
  transform:translateX(-50%);z-index:25;
  background:rgba(0,0,0,.75);color:#ffd60a;
  padding:10px 24px;border-radius:30px;font-size:14px;font-weight:700;
  display:none;border:2px solid #ffd60a;
  pointer-events:none;backdrop-filter:blur(6px);
}

/* ===== LOADING ROBLOX ===== */
#loading{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:linear-gradient(180deg,#0077b6,#00b4d8);
  color:#fff;transition:opacity .5s;
}
#loading .logo{
  font-size:56px;font-weight:900;
  color:#fff;text-shadow:0 6px 0 #0077b6,0 10px 40px rgba(0,0,0,.3);
}
#loading .logo span{color:#ffd60a}
#loadingSub{font-size:18px;opacity:.8;margin-top:2px}
.loader-wrap{margin-top:28px;display:flex;gap:10px}
.loader-dot{
  width:18px;height:18px;background:#ffd60a;border-radius:50%;
  animation:bounce 1s infinite alternate;
}
.loader-dot:nth-child(2){animation-delay:.2s}
.loader-dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{
  0%{transform:translateY(0);opacity:.4}
  100%{transform:translateY(-20px);opacity:1}
}
.fade-out{opacity:0;pointer-events:none}
.hidden{display:none!important}

/* ===== RESPONSIVE ===== */
@media(max-width:400px){
  #startScreen .logo{font-size:38px}
  #joystick{width:100px;height:100px}
  #stick{width:44px;height:44px;margin:-22px}
  #jumpBtn{width:56px;height:56px;font-size:22px}
  #interactBtn{width:52px;height:52px;font-size:22px}
  #chatToggle{width:46px;height:46px;font-size:18px}
}
</style>
</head>
<body>

<div id="startScreen">
  <div class="logo">GHOZ <span>WORLD</span></div>
  <div class="sub">✦ Roblox Style Hangout ✦</div>
  
  <div class="form-group">
    <label>👤 Nama Kamu</label>
    <input type="text" id="nickInput" placeholder="Masukkan nama..." maxlength="16" autocomplete="off">
  </div>
  
  <div class="form-group">
    <label>🎨 Pilih Karakter</label>
    <div class="gender-row">
      <button class="gender-btn boy" data-gender="boy">
        <span class="emoji">👦</span>
        <span class="label">COWOK</span>
      </button>
      <button class="gender-btn girl" data-gender="girl">
        <span class="emoji">👧</span>
        <span class="label">CEWEK</span>
      </button>
    </div>
  </div>
  
  <button id="startBtn">🚀 MASUK DUNIA</button>
</div>

<div id="loading" class="hidden">
  <div class="logo">GHOZ <span>WORLD</span></div>
  <div id="loadingSub">✦ Loading Dunia ✦</div>
  <div class="loader-wrap">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="playerName">Player</div>
  <div id="status">⏳ Menghubungkan...</div>
</div>
<div id="players" class="hidden">👥 <span id="playerCount">1</span> Pemain</div>
<div id="locationBadge">📍 Outdoor</div>

<!-- Controls -->
<div id="joystick" class="hidden"><div id="stick"></div></div>
<div id="joystickLabel" class="hidden">◀ GERAK ▶</div>
<div id="jumpBtn" class="hidden">⬆</div>
<div id="interactBtn" class="hidden">🚪</div>
<div id="chatToggle" class="hidden">💬</div>

<div id="chatBar">
  <input type="text" id="chatInput" placeholder="Ketik pesan..." maxlength="60" autocomplete="off">
  <button id="chatSend">➤</button>
</div>

<div id="prompt">🔑 Tekan 🚪 untuk masuk</div>

<div id="passModal">
  <div class="box">
    <h3>🔐 MUSEUM RAHASIA</h3>
    <p>Masukkan password spesial untuk masuk</p>
    <input type="password" id="passInput" placeholder="••••••" maxlength="20">
    <div>
      <button id="passCancel">Batal</button>
      <button id="passSubmit">Masuk</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
