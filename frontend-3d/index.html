<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <meta name="theme-color" content="#79b7e8" />

  <title>Ghoz World</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: Arial, sans-serif;
      background: #79b7e8;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* =========================
       HUD
    ========================= */

    #hud {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      z-index: 20;

      min-width: 150px;

      padding: 10px 14px;

      color: white;

      background: rgba(15, 25, 35, 0.65);

      border: 1px solid rgba(255,255,255,.15);

      border-radius: 15px;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      pointer-events: none;
    }

    #playerName {
      font-weight: bold;
      font-size: 14px;
    }

    #status {
      margin-top: 4px;
      font-size: 12px;
      opacity: .85;
    }

    /* =========================
       JOYSTICK
    ========================= */

    #joystick {
      position: fixed;

      left: 25px;
      bottom: max(25px, env(safe-area-inset-bottom));

      width: 145px;
      height: 145px;

      z-index: 30;

      border-radius: 50%;

      background: rgba(255,255,255,.16);

      border: 2px solid rgba(255,255,255,.22);

      box-shadow:
        inset 0 0 25px rgba(0,0,0,.12),
        0 8px 25px rgba(0,0,0,.15);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      touch-action: none;
    }

    #stick {
      position: absolute;

      width: 68px;
      height: 68px;

      left: 50%;
      top: 50%;

      margin-left: -34px;
      margin-top: -34px;

      border-radius: 50%;

      background: rgba(255,255,255,.65);

      border: 3px solid rgba(255,255,255,.8);

      box-shadow:
        0 5px 15px rgba(0,0,0,.2);

      transition: transform .05s linear;

      pointer-events: none;
    }

    #joystickLabel {
      position: fixed;

      left: 32px;
      bottom: max(7px, env(safe-area-inset-bottom));

      z-index: 29;

      color: rgba(255,255,255,.7);

      font-size: 10px;

      pointer-events: none;
    }

    /* =========================
       TOP RIGHT
    ========================= */

    #players {
      position: fixed;

      top: max(12px, env(safe-area-inset-top));
      right: 12px;

      z-index: 20;

      padding: 9px 12px;

      color: white;

      background: rgba(15,25,35,.55);

      border-radius: 14px;

      font-size: 12px;

      backdrop-filter: blur(8px);

      pointer-events: none;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      background: #79b7e8;

      color: white;

      transition: opacity .4s ease;
    }

    #loadingTitle {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    #loadingText {
      font-size: 13px;
      opacity: .85;
    }

    .loader {
      width: 38px;
      height: 38px;

      margin-top: 18px;

      border: 4px solid rgba(255,255,255,.3);
      border-top-color: white;

      border-radius: 50%;

      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (min-width: 800px) {
      #joystick {
        left: 35px;
        bottom: 35px;
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div id="loadingTitle">GHOZ WORLD</div>
    <div id="loadingText">Memuat dunia...</div>
    <div class="loader"></div>
  </div>

  <div id="hud">
    <div id="playerName">Player</div>
    <div id="status">Menghubungkan...</div>
  </div>

  <div id="players">
    👥 <span id="playerCount">1</span> Player
  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="joystickLabel">
    Geser untuk bergerak
  </div>

  <script src="app.js"></script>

</body>
</html>
